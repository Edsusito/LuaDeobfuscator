<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edsusito Lua Analyzer</title>

<style>
:root{
    --bg:#090a10;
    --panel:#10121a;
    --panel2:#0c0e15;
    --line:#272b38;
    --text:#eef1f7;
    --muted:#8b91a3;
    --accent:#a78bfa;
    --accent2:#7c3aed;
    --good:#55d187;
    --warn:#eabf55;
    --bad:#ef6675;
}

*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 0%,#21143d 0,transparent 32%),
        radial-gradient(circle at 90% 100%,#151a35 0,transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:Segoe UI,Arial,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(16,18,26,.92);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(135deg,var(--accent2),#20243b);
    border:1px solid #59418c;
    box-shadow:0 0 25px #7c3aed33;
    font-weight:900;
    font-size:18px;
}

.title{
    font-size:18px;
    font-weight:800;
}

.subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.status{
    color:var(--muted);
    font-size:12px;
}

main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:14px;
}

.panel{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(16,18,26,.94);
    box-shadow:0 15px 45px #0005;
}

.panel-head{
    height:52px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
}

.panel-title{
    font-size:13px;
    font-weight:800;
}

textarea{
    flex:1;
    min-height:0;
    width:100%;
    resize:none;
    border:0;
    outline:0;
    padding:17px;
    background:var(--panel2);
    color:#dce0e9;
    font:13px/1.55 Consolas,"Courier New",monospace;
}

textarea::placeholder{color:#4d5363}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    border-top:1px solid var(--line);
}

button{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    color:white;
    background:#202431;
    border:1px solid var(--line);
    cursor:pointer;
    font-size:12px;
    font-weight:800;
}

button:hover{
    filter:brightness(1.18);
    transform:translateY(-1px);
}

.primary{
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    border:0;
}

.danger{color:#ff8d99}

.info{
    min-height:31px;
    padding:8px 12px;
    color:var(--muted);
    font-size:10px;
    border-top:1px solid var(--line);
}

footer{
    height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    color:var(--muted);
    font-size:10px;
    border-top:1px solid var(--line);
    background:#0d0f16;
}

.ok{color:var(--good)}
.warn{color:var(--warn)}

@media(max-width:900px){
    body{overflow:auto}
    .app{height:auto;min-height:100vh}
    main{grid-template-columns:1fr;min-height:calc(100vh - 108px)}
    .panel{min-height:450px}
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="brand">
        <div class="avatar">E</div>
        <div>
            <div class="title">Edsusito Lua Analyzer</div>
            <div class="subtitle">
                Análisis multicapa · estático · sin ejecución
            </div>
        </div>
    </div>

    <div class="status" id="status">Listo</div>
</header>

<main>

<section class="panel">

    <div class="panel-head">
        <span class="panel-title">Código / Loadstring / URL</span>
        <span class="status" id="inputStats">0 caracteres</span>
    </div>

    <textarea id="input"
        spellcheck="false"
        placeholder="Pega aquí Lua, un loadstring, una URL o código ofuscado..."></textarea>

    <div class="toolbar">
        <button class="primary" onclick="analyze()">⚡ DESOFUSCAR</button>
        <button onclick="loadExample()">🧪 EJEMPLO</button>
        <button onclick="clearAll()" class="danger">🗑 LIMPIAR</button>
    </div>

    <div class="info">
        El código se analiza como texto. Nunca se ejecuta.
    </div>

</section>

<section class="panel">

    <div class="panel-head">
        <span class="panel-title">Resultado</span>
        <span class="status" id="outputStats">0 caracteres</span>
    </div>

    <textarea id="output"
        spellcheck="false"
        readonly
        placeholder="Aquí aparecerá el resultado..."></textarea>

    <div class="toolbar">
        <button class="primary" onclick="copyResult()">📋 COPIAR</button>
        <button onclick="selectResult()">SELECT</button>
        <button onclick="downloadResult()">💾 .LUA</button>
    </div>

    <div class="info" id="analysisInfo">
        Esperando análisis.
    </div>

</section>

</main>

<footer>
    <span>Edsusito Analyzer</span>
    <span>Máximo 25 ciclos · análisis estático</span>
</footer>

</div>

<script>

/* =========================================================
   ESTADO
========================================================= */

const input = document.getElementById("input");
const output = document.getElementById("output");
const statusEl = document.getElementById("status");

input.addEventListener("input",()=>{
    inputStats.textContent =
        input.value.length.toLocaleString()+" caracteres";
});


/* =========================================================
   UTILIDADES
========================================================= */

function normalize(s){
    return s
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n")
        .replace(/\uFEFF/g,"");
}

function count(re,s){
    return (s.match(re)||[]).length;
}


/* =========================================================
   DETECCIÓN DE URL
========================================================= */

function extractUrls(s){

    const found=[];
    const re=/https?:\/\/[^\s"'`)]+/gi;
    let m;

    while((m=re.exec(s))!==null){
        if(!found.includes(m[0]))
            found.push(m[0]);
    }

    return found;
}

function extractHttpGet(s){

    const patterns=[
        /(?:game\s*:\s*)?HttpGet\s*\(\s*["']([^"']+)["']/i,
        /HttpGet\s*\(\s*([^)]+)\)/i
    ];

    for(const re of patterns){

        const m=s.match(re);

        if(m && m[1] &&
           /^https?:\/\//i.test(m[1])){

            return m[1];
        }
    }

    return null;
}


/* =========================================================
   DECODIFICACIÓN DE ESCAPES
========================================================= */

function numericEscapes(s){

    return s.replace(
        /\\([0-9]{1,3})/g,
        (m,n)=>{
            const x=Number(n);
            return x<=255
                ? String.fromCharCode(x)
                : m;
        }
    );
}

function hexEscapes(s){

    return s.replace(
        /\\x([0-9a-fA-F]{2})/g,
        (m,h)=>String.fromCharCode(parseInt(h,16))
    );
}

function unicodeEscapes(s){

    return s.replace(
        /\\u\{([0-9a-fA-F]+)\}/g,
        (m,h)=>{
            try{
                return String.fromCodePoint(parseInt(h,16));
            }catch{
                return m;
            }
        }
    );
}


/* =========================================================
   string.char
========================================================= */

function decodeStringChar(s){

    return s.replace(
        /string\s*\.\s*char\s*\(\s*([0-9,\s]+)\s*\)/gi,
        (m,args)=>{

            const nums=args.split(",")
                .map(x=>Number(x.trim()));

            if(!nums.length) return m;

            if(nums.some(
                x=>!Number.isInteger(x)||x<0||x>255
            )) return m;

            return nums
                .map(x=>String.fromCharCode(x))
                .join("");
        }
    );
}


/* =========================================================
   string.byte INVERSO SIMPLE
========================================================= */

function decodeBytePatterns(s){

    return s.replace(
        /string\s*\.\s*char\s*\(\s*([^)]{1,1000})\)/gi,
        (m,args)=>{

            if(!/^\s*\d+(?:\s*,\s*\d+)*\s*$/.test(args))
                return m;

            return decodeStringChar(m);
        }
    );
}


/* =========================================================
   CONCATENACIONES CONSTANTES

   "ab" .. "cd" -> "abcd"
========================================================= */

function foldStrings(s){

    let old="";

    for(let i=0;i<8 && s!==old;i++){

        old=s;

        s=s.replace(
            /(["'])(.*?)\1\s*\.\.\s*(["'])(.*?)\3/g,
            (m,q,a,q2,b)=>q+a+b+q
        );
    }

    return s;
}


/* =========================================================
   HEX PURO
========================================================= */

function decodeHexStrings(s){

    return s.replace(
        /(["'])((?:[0-9a-fA-F]{2}){6,})(\1)/g,
        (m,q,h,q2)=>{

            let out="";

            for(let i=0;i<h.length;i+=2){
                out+=String.fromCharCode(
                    parseInt(h.slice(i,i+2),16)
                );
            }

            /*
             * Solo sustituimos si parece texto.
             */
            const printable=count(
                /[\x20-\x7E]/g,
                out
            );

            return printable/out.length>.7
                ? q+out+q
                : m;
        }
    );
}


/* =========================================================
   BASE64 CONSERVADOR
========================================================= */

function decodeBase64(s){

    return s.replace(
        /(["'])([A-Za-z0-9+/]{32,}={0,2})\1/g,
        (m,q,b64)=>{

            try{

                const decoded=atob(b64);

                const printable=count(
                    /[\x09\x0A\x0D\x20-\x7E]/g,
                    decoded
                );

                if(
                    decoded.length &&
                    printable/decoded.length>.75
                ){
                    return q+decoded+q;
                }

            }catch{}

            return m;
        }
    );
}


/* =========================================================
   URL ENCODED
========================================================= */

function decodeUrlEncoding(s){

    return s.replace(
        /(["'])([^"']{8,})(\1)/g,
        (m,q,v,q2)=>{

            if(!/%[0-9a-fA-F]{2}/.test(v))
                return m;

            try{

                const d=decodeURIComponent(v);

                return d!==v
                    ? q+d+q
                    : m;

            }catch{
                return m;
            }
        }
    );
}


/* =========================================================
   TABLAS SIMPLES DE CARACTERES

   {104,111,108,97}
   ========================================================= */

function decodeNumericTables(s){

    return s.replace(
        /\{((?:\s*\d+\s*,){2,}\s*\d+)\}/g,
        (m,body)=>{

            const nums=body
                .split(",")
                .map(x=>Number(x.trim()));

            if(nums.some(
                x=>x<0||x>255||!Number.isInteger(x)
            )) return m;

            const text=nums
                .map(x=>String.fromCharCode(x))
                .join("");

            const printable=count(
                /[\x20-\x7E]/g,
                text
            );

            return printable/text.length>.8
                ? JSON.stringify(text)
                : m;
        }
    );
}


/* =========================================================
   CONSTANTES MATEMÁTICAS SEGURAS

   100 + 20 -> 120
   5 * 4 -> 20

   No ejecutamos Lua.
========================================================= */

function foldMath(s){

    for(let i=0;i<4;i++){

        const old=s;

        s=s.replace(
            /(?<![\w.])(\d+)\s*([+*%-])\s*(\d+)(?![\w.])/g,
            (m,a,op,b)=>{

                const x=Number(a);
                const y=Number(b);

                let r;

                if(op==="+") r=x+y;
                else if(op==="-") r=x-y;
                else if(op==="*") r=x*y;
                else if(op==="%") r=x%y;

                return Number.isFinite(r)
                    ? String(r)
                    : m;
            }
        );

        if(old===s) break;
    }

    return s;
}


/* =========================================================
   QUITAR WRAPPERS MUY SIMPLES

   NO elimina lógica arbitrariamente.
========================================================= */

function unwrapSimpleReturn(s){

    s=s.replace(
        /^\s*return\s*\(\s*function\s*\(\.\.\.\)\s*([\s\S]*)\s*end\s*\)\s*\(\s*\.\.\.\s*\)\s*;?\s*$/i,
        "$1"
    );

    return s;
}


/* =========================================================
   COMENTARIOS BASURA

   Conservador: solo comentarios largos sin estructura.
========================================================= */

function cleanNoiseComments(s){

    return s.replace(
        /--[^\n]{300,}/g,
        ""
    );
}


/* =========================================================
   DETECCIÓN DE VARIABLES
========================================================= */

function variableStats(s){

    const names=[];
    const re=
        /\b(?:local\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=/g;

    let m;

    while((m=re.exec(s))!==null){

        if(!names.includes(m[1]))
            names.push(m[1]);
    }

    const suspicious=names.filter(
        n =>
            /^[IlO0_]{2,}$/.test(n) ||
            /^[a-zA-Z]{1,2}\d+$/.test(n) ||
            n.length>=18
    );

    return {
        total:names.length,
        suspicious:suspicious.length
    };
}


/* =========================================================
   PASADA DEL MOTOR
========================================================= */

function pass(s){

    let x=s;

    x=numericEscapes(x);
    x=hexEscapes(x);
    x=unicodeEscapes(x);
    x=decodeStringChar(x);
    x=decodeBytePatterns(x);
    x=decodeHexStrings(x);
    x=decodeBase64(x);
    x=decodeUrlEncoding(x);
    x=decodeNumericTables(x);
    x=foldStrings(x);
    x=foldMath(x);
    x=cleanNoiseComments(x);
    x=unwrapSimpleReturn(x);

    return x;
}


/* =========================================================
   MOTOR MULTICAPA
========================================================= */

function multiPass(code){

    let current=normalize(code);

    const history=[];
    const max=25;

    for(let i=1;i<=max;i++){

        const before=current;
        const next=pass(current);

        if(next===before)
            break;

        history.push({
            layer:i,
            before:before.length,
            after:next.length
        });

        current=next;
    }

    return {
        code:current,
        history
    };
}


/* =========================================================
   FORMATEADOR LUA

   Conservador para no destruir lógica.
========================================================= */

function formatLua(s){

    const lines=s.split("\n");
    const out=[];
    let indent=0;

    for(let raw of lines){

        let line=raw.trim();

        if(!line){
            out.push("");
            continue;
        }

        if(
            /^(end|until)\b/i.test(line) ||
            /^}/.test(line)
        ){
            indent=Math.max(0,indent-1);
        }

        out.push(
            "    ".repeat(indent)+line
        );

        const opens =
            /\b(function|if|for|while|repeat|do)\b/i.test(line);

        const closes =
            /\bend\s*[,;]?\s*$/i.test(line) ||
            /\buntil\b/i.test(line);

        if(opens && !closes)
            indent++;
    }

    return out.join("\n");
}


/* =========================================================
   ANÁLISIS
========================================================= */

function analyzeCode(code){

    return {
        loadstrings:count(/\bloadstring\s*\(/gi,code),
        httpgets:count(/\bHttpGet\s*\(/gi,code),
        strings:count(/(["'])/g,code)/2,
        chars:count(/string\s*\.\s*char\s*\(/gi,code),
        numeric:count(/\\[0-9]{1,3}/g,code),
        hex:count(/\\x[0-9a-fA-F]{2}/g,code),
        urls:extractUrls(code).length,
        functions:count(/\bfunction\b/gi,code),
        tables:count(/\{/g,code)
    };
}


/* =========================================================
   PROCESO PRINCIPAL
========================================================= */

async function analyze(){

    let code=input.value.trim();

    if(!code){

        statusEl.textContent="No hay código";
        return;
    }

    statusEl.textContent="Analizando...";

    try{

        /*
         * Primero intentamos encontrar un HttpGet.
         * Solo recuperamos TEXTO.
         */

        const url=extractHttpGet(code);

        if(url){

            statusEl.textContent=
                "Obteniendo contenido remoto...";

            try{

                const response=await fetch(url);

                if(response.ok){

                    code=await response.text();

                }else{

                    throw new Error(
                        "HTTP "+response.status
                    );
                }

            }catch(err){

                output.value=
`URL DETECTADA

${url}

No fue posible obtener automáticamente
el contenido desde el navegador.

Motivo:
${err.message}

Puedes copiar el contenido remoto
y pegarlo directamente aquí.`;

                analysisInfo.textContent=
                    "URL detectada · acceso remoto bloqueado";

                statusEl.textContent="Análisis parcial";

                return;
            }
        }

        const before=analyzeCode(code);

        const result=multiPass(code);

        const formatted=formatLua(result.code);

        const after=analyzeCode(formatted);

        output.value=formatted;

        outputStats.textContent=
            formatted.length.toLocaleString()+
            " caracteres";

        const vars=variableStats(formatted);

        analysisInfo.innerHTML=
            `<span class="ok">✓ Análisis terminado</span> · `+
            `Capas: ${result.history.length} · `+
            `Loadstrings: ${after.loadstrings} · `+
            `HttpGet: ${after.httpgets} · `+
            `string.char: ${before.chars} → ${after.chars} · `+
            `escapes: ${before.numeric+before.hex} → `+
            `${after.numeric+after.hex} · `+
            `variables sospechosas: ${vars.suspicious}`;

        statusEl.textContent="Listo ✓";

    }catch(err){

        output.value=
`ERROR DE ANÁLISIS

${err.message}`;

        analysisInfo.textContent=
            "El análisis encontró un error.";

        statusEl.textContent="Error";
    }
}


/* =========================================================
   COPIAR
========================================================= */

async function copyResult(){

    if(!output.value) return;

    try{

        await navigator.clipboard.writeText(
            output.value
        );

        statusEl.textContent="Copiado ✓";

    }catch{

        selectResult();
        document.execCommand("copy");

        statusEl.textContent="Copiado ✓";
    }
}


/* =========================================================
   SELECCIONAR
========================================================= */

function selectResult(){

    output.focus();
    output.select();
}


/* =========================================================
   DESCARGAR LUA
========================================================= */

function downloadResult(){

    if(!output.value) return;

    const blob=new Blob(
        [output.value],
        {type:"text/plain;charset=utf-8"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="edsusito_deobfuscated.lua";

    a.click();

    URL.revokeObjectURL(url);
}


/* =========================================================
   LIMPIAR
========================================================= */

function clearAll(){

    input.value="";
    output.value="";

    inputStats.textContent="0 caracteres";
    outputStats.textContent="0 caracteres";

    analysisInfo.textContent=
        "Esperando análisis.";

    statusEl.textContent="Listo";
}


/* =========================================================
   EJEMPLO
========================================================= */

function loadExample(){

    input.value=
`local a = "\\72\\111\\108\\97"
local b = string.char(69,100,115,117,115,105,116,111)
local c = "Edsu" .. "sito"

print(a)
print(b)
print(c)`;

    inputStats.textContent=
        input.value.length.toLocaleString()+
        " caracteres";

    output.value="";

    outputStats.textContent="0 caracteres";

    analysisInfo.textContent=
        "Ejemplo cargado · pulsa DESOFUSCAR";

    statusEl.textContent="Ejemplo listo";
}

</script>

</body>
</html>
