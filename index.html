<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edsusito Lua Analyzer – Fase 7.3</title>
<style>
:root{
    --bg:#090a10;--panel:#10121a;--panel2:#0c0e15;--line:#272b38;
    --text:#eef1f7;--muted:#8b91a3;--accent:#a78bfa;--accent2:#7c3aed;
    --good:#55d187;--warn:#eabf55;--bad:#ef6675;
}
*{box-sizing:border-box}
body{
    margin:0;height:100vh;overflow:hidden;
    background:radial-gradient(circle at 15% 0%,#21143d 0,transparent 32%),
    radial-gradient(circle at 90% 100%,#151a35 0,transparent 35%),var(--bg);
    color:var(--text);font-family:Segoe UI,Arial,sans-serif;
}
.app{height:100vh;display:flex;flex-direction:column}
header{
    height:60px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:rgba(16,18,26,.92);border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px}
.avatar{
    width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent2),#20243b);border:1px solid #59418c;
    box-shadow:0 0 25px #7c3aed33;font-weight:900;font-size:16px;
}
.title{font-size:16px;font-weight:800}
.subtitle{color:var(--muted);font-size:10px;margin-top:1px}
.status{color:var(--muted);font-size:12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.panel{
    min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--line);border-radius:12px;background:rgba(16,18,26,.94);
    box-shadow:0 15px 45px #0005;
}
.panel-head{
    height:44px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);flex-shrink:0;
}
.panel-title{font-size:12px;font-weight:800}
textarea{
    flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;padding:14px;
    background:var(--panel2);color:#dce0e9;font:13px/1.5 Consolas,"Courier New",monospace;
}
textarea::placeholder{color:#4d5363}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-top:1px solid var(--line);flex-shrink:0}
button{
    border:0;border-radius:6px;padding:7px 12px;color:white;background:#202431;
    border:1px solid var(--line);cursor:pointer;font-size:11px;font-weight:700;
    transition:all .15s;
}
button:hover{filter:brightness(1.18);transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border:0}
.danger{color:#ff8d99}
.info{
    min-height:28px;padding:6px 10px;color:var(--muted);font-size:10px;
    border-top:1px solid var(--line);flex-shrink:0;overflow-y:auto;
}
.tabs{display:flex;gap:4px;padding:4px 8px;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{background:transparent;border:0;color:var(--muted);padding:4px 10px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer}
.tab.active{background:var(--accent2);color:#fff}
.tab-content{flex:1;display:none;flex-direction:column;min-height:0}
.tab-content.active{display:flex}
footer{
    height:30px;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;color:var(--muted);font-size:9px;border-top:1px solid var(--line);
    background:#0d0f16;flex-shrink:0;
}
.ok{color:var(--good)}.warn{color:var(--warn)}
@media(max-width:900px){
    body{overflow:auto}.app{height:auto;min-height:100vh}
    main{grid-template-columns:1fr;min-height:calc(100vh - 90px)}.panel{min-height:400px}
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">
<div class="avatar">E</div>

</header>
<main>
<!-- Panel izquierdo: entrada -->
<section class="panel">

</div>

<div class="tab-content" id="tab-stats" style="display:none;flex-direction:column;min-height:0;flex:1;padding:10px;overflow:auto;background:var(--panel2);font-size:12px;white-space:pre-wrap"></div>
<div class="tab-content" id="tab-layers" style="display:none;flex-direction:column;min-height:0;flex:1;padding:10px;overflow:auto;background:var(--panel2);font-size:12px;white-space:pre-wrap"></div>

<footer>
<span>Edsusito Analyzer Fase 7.3</span>
<span>Constantes · Escapes · Base64/85/91 · Flattening · VM</span>

<script>
/* =========================================================
   ESTADO
========================================================= */
const input = document.getElementById("input");
const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const inputStats = document.getElementById("inputStats");
const outputStats = document.getElementById("outputStats");
const analysisInfo = document.getElementById("analysisInfo");
const inputInfo = document.getElementById("inputInfo");
const tabStats = document.getElementById("tab-stats");
const tabLayers = document.getElementById("tab-layers");

input.addEventListener("input",()=>{
    inputStats.textContent = input.value.length.toLocaleString()+" caracteres";
});

document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        document.getElementById(tab.dataset.tab).classList.add('active');
        const content = document.getElementById(tab.dataset.tab);
        content.style.display = 'flex';
        document.querySelectorAll('.tab-content').forEach(c=>{
            if(c.id !== tab.dataset.tab) c.style.display = 'none';
        });
    });
});

function normalize(s){
    return s.replace(/\r\n/g,"\n").replace(/\r/g,"\n").replace(/\uFEFF/g,"");
}
function count(re,s){ return (s.match(re)||[]).length; }

function extractUrls(s){
    const found=[];
    const re=/https?:\/\/[^\s"'`)]+/gi;
    let m;
    while((m=re.exec(s))!==null){
        if(!found.includes(m[0])) found.push(m[0]);
    }
    return found;
}
function extractHttpGet(s){
    const patterns=[
        /(?:game\s*:\s*)?HttpGet\s*\(\s*["']([^"']+)["']/i,
        /HttpGet\s*\(\s*([^)]+)\)/i
    ];
    for(const re of patterns){
        const m=s.match(re);
        if(m && m[1] && /^https?:\/\//i.test(m[1])) return m[1];
    }
    return null;
}

function numericEscapes(s){
    return s.replace(/\\([0-9]{1,3})(?![0-9])/g, (m,n)=>{
        const x=Number(n);
        return x<=255 ? String.fromCharCode(x) : m;
    });
}
function hexEscapes(s){
    return s.replace(/\\x([0-9a-fA-F]{2})/g, (m,h)=>String.fromCharCode(parseInt(h,16)));
}
function unicodeEscapes(s){
    s = s.replace(/\\u\{([0-9a-fA-F]+)\}/g, (m,h)=>{
        try{ return String.fromCodePoint(parseInt(h,16)); }catch{ return m; }
    });
    s = s.replace(/\\u([0-9a-fA-F]{4})/g, (m,h)=>String.fromCharCode(parseInt(h,16)));
    return s;
}
function luaStandardEscapes(s){
    const map = {
        'a': '\x07', 'b': '\x08', 'f': '\x0c', 'n': '\n', 'r': '\r',
        't': '\t', 'v': '\x0b', '\\': '\\', '"': '"', "'": "'", 'z': ''
    };
    return s.replace(/\\([abfnrtv\\"'])/g, (m,c)=>map[c] || m)
            .replace(/\\z\s*/g, '');
}

function decodeStringChar(s){
    return s.replace(/string\s*\.\s*char\s*\(\s*([^)]+)\s*\)/gi, (m,args)=>{
        const parts = args.split(',').map(x=>x.trim());
        const nums = parts.map(x=>Number(x));
        if(nums.some(x=>!Number.isInteger(x)||x<0||x>255)) return m;
        return nums.map(x=>String.fromCharCode(x)).join("");
    });
}

function decodeBase64(s){
    s = s.replace(/Base64\s*\.\s*decode\s*\(\s*["']([A-Za-z0-9+/=]+)["']\s*\)/g, (m,b64)=>{
        try{ return JSON.stringify(atob(b64)); }catch{ return m; }
    });
    s = s.replace(/(["'])([A-Za-z0-9+/]{30,}={0,2})\1/g, (m,q,b64)=>{
        try{
            const decoded = atob(b64);
            const printable = decoded.replace(/[^\x20-\x7E\n\r\t]/g, '').length;
            if(decoded.length>0 && printable/decoded.length>0.7) return q+decoded+q;
        }catch{}
        return m;
    });
    return s;
}

function decodeBase85(s){
    return s.replace(/(["'])(<~[\s\S]*?~>)\1/g, (m,q,encoded)=>{
        try{
            const data = encoded.slice(2, -2).replace(/\s/g,'');
            if(data.length === 0) return m;
            let out = '';
            let i = 0;
            while(i < data.length){
                let chunk = data.slice(i, i+5);
                if(chunk.length < 5) chunk = chunk.padEnd(5, 'u');
                let n = 0;
                for(let j=0; j<5; j++){
                    const c = chunk.charCodeAt(j);
                    if(c < 33 || c > 117) throw new Error('carácter inválido en ASCII85');
                    n = n * 85 + (c - 33);
                }
                const bytes = [];
                for(let j=0; j<4; j++){
                    bytes.push((n >> (8*(3-j))) & 0xFF);
                }
                const trunc = (data.length - i) < 5 ? 4 - (5 - (data.length - i)) : 4;
                out += String.fromCharCode(...bytes.slice(0, trunc));
                i += 5;
            }
            return q + out + q;
        }catch(e){
            return m;
        }
    });
}

function decodeBase91(s){
    return s.replace(/(["'])([A-Za-z0-9!#$%&()*+,./:;<=>?@[\]^_`{|}~-]{20,})\1/g, (m,q,str)=>{
        try{
            const decoded = base91Decode(str);
            if(decoded && decoded.length > 0){
                const printable = decoded.replace(/[^\x20-\x7E\n\r\t]/g, '').length;
                if(printable/decoded.length > 0.7) return q + decoded + q;
            }
            return m;
        }catch{ return m; }
    });
}
function base91Decode(str){
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,./:;<=>?@[]^_`{|}~\"";
    const map = {};
    for(let i=0; i<alphabet.length; i++) map[alphabet[i]] = i;
    let v = -1, b = 0, n = 0, out = [];
    for(let i=0; i<str.length; i++){
        const c = str[i];
        if(!(c in map)) continue;
        const k = map[c];
        if(v < 0) v = k;
        else {
            v += k * 91;
            b |= v << n;
            n += (v & 8191) > 88 ? 13 : 14;
            while(n > 7){
                out.push(b & 0xFF);
                b >>= 8;
                n -= 8;
            }
            v = -1;
        }
    }
    if(v > -1){
        b |= v << n;
        out.push(b & 0xFF);
    }
    return String.fromCharCode(...out);
}

function foldStrings(s){
    let old = "";
    for(let i=0; i<30 && s!==old; i++){
        old = s;
        s = s.replace(/(["'])([^"']*)\1\s*\.\.\s*(["'])([^"']*)\3/g, (m,q1,s1,q2,s2)=>q1+s1+s2+q1);
        s = s.replace(/(["'])\s*\.\.\s*(["'])/g, (m,q1,q2)=>q1+q2);
    }
    return s;
}

function decodeNumericTables(s){
    return s.replace(/\{((?:\s*\d+\s*,){2,}\s*\d+)\}/g, (m,body)=>{
        const nums=body.split(",").map(x=>Number(x.trim()));
        if(nums.some(x=>x<32 || x>126 || !Number.isInteger(x))) return m;
        const text=nums.map(x=>String.fromCharCode(x)).join("");
        const printable=count(/[\x20-\x7E]/g,text);
        if(printable/text.length > 0.8){
            return '"' + text.replace(/\\/g,'\\\\').replace(/"/g,'\\"') + '"';
        }
        return m;
    });
}

function decodeHexStrings(s){
    return s.replace(/(["'])((?:[0-9a-fA-F]{2}){6,})(\1)/g, (m,q,h,q2)=>{
        let out="";
        for(let i=0;i<h.length;i+=2) out+=String.fromCharCode(parseInt(h.slice(i,i+2),16));
        const printable=count(/[\x20-\x7E]/g,out);
        return printable/out.length>.7 ? q+out+q : m;
    });
}

function decodeUrlEncoding(s){
    return s.replace(/(["'])([^"']{8,})(\1)/g, (m,q,v,q2)=>{
        if(!/%[0-9a-fA-F]{2}/.test(v)) return m;
        try{ const d=decodeURIComponent(v); return d!==v ? q+d+q : m; }catch{return m;}
    });
}

function foldMath(s){
    for(let i=0;i<8;i++){
        const old=s;
        s=s.replace(/(?<![\w.])(\d+)\s*([+*%-])\s*(\d+)(?![\w.])/g, (m,a,op,b)=>{
            const x=Number(a), y=Number(b);
            let r;
            if(op==="+") r=x+y;
            else if(op==="-") r=x-y;
            else if(op==="*") r=x*y;
            else if(op==="%") r=x%y;
            return Number.isFinite(r) ? String(r) : m;
        });
        if(old===s) break;
    }
    return s;
}

function unwrapSimpleReturn(s){
    return s.replace(/^\s*return\s*\(\s*function\s*\(\.\.\.\)\s*([\s\S]*)\s*end\s*\)\s*\(\s*\.\.\.\s*\)\s*;?\s*$/i, "$1");
}

function cleanNoiseComments(s){
    return s.replace(/--[^\n]{300,}/g,"");
}

function extractNestedLoaders(s){
    const loaders = [];
    const re = /loadstring\s*\(\s*(["'])([\s\S]*?)\1\s*\)/g;
    let m;
    while ((m = re.exec(s)) !== null) {
        loaders.push({ type: 'loadstring', content: m[2] });
    }
    return loaders;
}
function unpackLoaders(s){
    return s.replace(/loadstring\s*\(\s*(["'])([\s\S]*?)\1\s*\)\s*\(\s*\)/g, (m,q,content)=>content);
}

/* =========================================================
   PROPAGACIÓN DE CONSTANTES CORREGIDA (definitiva)
========================================================= */
function propagateConstants(s) {
    const constMap = {};
    const lines = s.split('\n');
    
    // Primera pasada: recolectar declaraciones locales con valores literales
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        // Eliminar comentarios al final
        let clean = line.replace(/--.*$/, '').trim();
        if (!clean) continue;
        const match = clean.match(/^local\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+?)\s*$/);
        if (!match) continue;
        const varName = match[1];
        let valueExpr = match[2].trim();
        
        // Detectar número
        if (/^-?\d+\.?\d*$/.test(valueExpr)) {
            constMap[varName] = { type: 'number', value: parseFloat(valueExpr) };
        }
        // Detectar cadena literal (con comillas simples o dobles)
        else if (/^["'].*["']$/.test(valueExpr)) {
            const quote = valueExpr[0];
            const content = valueExpr.slice(1, -1);
            constMap[varName] = { type: 'string', value: content };
        }
        // Detectar operación aritmética simple con una variable y un número
        else if (/^\w+\s*[+\-*/%]\s*\d+$/.test(valueExpr)) {
            const parts = valueExpr.split(/([+\-*/%])/);
            const leftVar = parts[0].trim();
            const op = parts[1];
            const rightNum = parseFloat(parts[2]);
            if (constMap[leftVar] && constMap[leftVar].type === 'number') {
                const leftVal = constMap[leftVar].value;
                let result;
                switch(op) {
                    case '+': result = leftVal + rightNum; break;
                    case '-': result = leftVal - rightNum; break;
                    case '*': result = leftVal * rightNum; break;
                    case '/': result = leftVal / rightNum; break;
                    case '%': result = leftVal % rightNum; break;
                    default: continue;
                }
                if (Number.isFinite(result)) {
                    constMap[varName] = { type: 'number', value: result };
                }
            }
        }
        // Detectar operación aritmética con dos variables (ambas numéricas)
        else if (/^\w+\s*[+\-*/%]\s*\w+$/.test(valueExpr)) {
            const parts = valueExpr.split(/([+\-*/%])/);
            const leftVar = parts[0].trim();
            const op = parts[1];
            const rightVar = parts[2].trim();
            if (constMap[leftVar] && constMap[leftVar].type === 'number' &&
                constMap[rightVar] && constMap[rightVar].type === 'number') {
                const leftVal = constMap[leftVar].value;
                const rightVal = constMap[rightVar].value;
                let result;
                switch(op) {
                    case '+': result = leftVal + rightVal; break;
                    case '-': result = leftVal - rightVal; break;
                    case '*': result = leftVal * rightVal; break;
                    case '/': result = leftVal / rightVal; break;
                    case '%': result = leftVal % rightVal; break;
                    default: continue;
                }
                if (Number.isFinite(result)) {
                    constMap[varName] = { type: 'number', value: result };
                }
            }
        }
    }
    
    // Segunda pasada: reemplazar referencias, saltando solo la declaración exacta
    const linesOut = [];
    for (let line of lines) {
        let modifiedLine = line;
        for (const [varName, data] of Object.entries(constMap)) {
            // Saltar solo si la línea es "local varName = ..." (declaración exacta)
            if (new RegExp('^\\s*local\\s+' + varName + '\\s*=').test(line)) {
                continue;
            }
            // Reemplazar en partes que no estén dentro de comillas
            let parts = [];
            let current = '';
            let inString = false;
            let stringChar = '';
            for (let i = 0; i < modifiedLine.length; i++) {
                const ch = modifiedLine[i];
                if (!inString && (ch === '"' || ch === "'")) {
                    if (current) parts.push({ type: 'text', content: current });
                    current = '';
                    inString = true;
                    stringChar = ch;
                } else if (inString && ch === stringChar && modifiedLine[i-1] !== '\\') {
                    parts.push({ type: 'string', content: current });
                    current = '';
                    inString = false;
                } else {
                    current += ch;
                }
            }
            if (current) parts.push({ type: inString ? 'string' : 'text', content: current });
            
            let newLine = '';
            for (const part of parts) {
                if (part.type === 'text') {
                    let text = part.content;
                    const re = new RegExp('\\b' + varName + '\\b', 'g');
                    if (data.type === 'number') {
                        text = text.replace(re, String(data.value));
                    } else if (data.type === 'string') {
                        const escaped = data.value.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
                        text = text.replace(re, '"' + escaped + '"');
                    }
                    newLine += text;
                } else {
                    newLine += part.content;
                }
            }
            modifiedLine = newLine;
        }
        linesOut.push(modifiedLine);
    }
    return linesOut.join('\n');
}

/* =========================================================
   FASE 5: CONTROL FLOW FLATTENING
========================================================= */
function deobfuscateControlFlow(s){
    const lines = s.split('\n');
    let whileStart = -1;
    for(let i=0; i<lines.length; i++){
        if(/^\s*while\s+true\s+do\s*$/.test(lines[i])){
            whileStart = i;
            break;
        }
    }
    if(whileStart === -1) return s;
    let depth = 0;
    let whileEnd = -1;
    for(let i=whileStart; i<lines.length; i++){
        const line = lines[i];
        if(/\bwhile\b/.test(line) && !/end/.test(line)) depth++;
        if(/\bend\b/.test(line)) depth--;
        if(depth === 0 && i > whileStart){
            whileEnd = i;
            break;
        }
    }
    if(whileEnd === -1) return s;
    const bodyLines = lines.slice(whileStart+1, whileEnd);
    let initialState = null;
    for(const line of bodyLines){
        const m = line.match(/local\s+(\w+)\s*=\s*(\d+)/);
        if(m){
            initialState = parseInt(m[2]);
            break;
        }
    }
    if(initialState === null) return s;
    const blocks = {};
    let currentBlock = null;
    let currentLines = [];
    for(const line of bodyLines){
        const ifMatch = line.match(/^\s*if\s+(\w+)\s*==\s*(\d+)\s+then\s*$/);
        const elseifMatch = line.match(/^\s*elseif\s+(\w+)\s*==\s*(\d+)\s+then\s*$/);
        const elseMatch = /^\s*else\s*$/.test(line);
        const endMatch = /^\s*end\s*$/.test(line);
        if(ifMatch || elseifMatch){
            if(currentBlock !== null){
                blocks[currentBlock] = currentLines.join('\n');
                currentLines = [];
            }
            const state = parseInt((ifMatch||elseifMatch)[2]);
            currentBlock = state;
        } else if(elseMatch){
            if(currentBlock !== null){
                blocks[currentBlock] = currentLines.join('\n');
                currentLines = [];
            }
            currentBlock = -1;
        } else if(endMatch){
            if(currentBlock !== null){
                blocks[currentBlock] = currentLines.join('\n');
                currentLines = [];
                currentBlock = null;
            }
        } else {
            if(currentBlock !== null){
                currentLines.push(line);
            }
        }
    }
    let sortedKeys = Object.keys(blocks).map(Number).sort((a,b)=>a-b);
    const elseBlock = blocks[-1];
    sortedKeys = sortedKeys.filter(k => k !== -1);
    if(elseBlock !== undefined) sortedKeys.push(-1);
    let result = [];
    for(const key of sortedKeys){
        const block = blocks[key];
        if(block){
            result.push(block);
        }
    }
    const before = lines.slice(0, whileStart).join('\n');
    const after = lines.slice(whileEnd+1).join('\n');
    return before + '\n' + result.join('\n') + '\n' + after;
}

/* =========================================================
   FASE 6: VM UNPACKER (mejorado)
========================================================= */
function unpackVM(s){
    const lines = s.split('\n');
    let instrStart = -1, instrEnd = -1;
    for(let i=0; i<lines.length; i++){
        if(/^\s*local\s+\w+\s*=\s*\{/.test(lines[i])){
            instrStart = i;
            let depth = 0;
            for(let j=i; j<lines.length; j++){
                const line = lines[j];
                depth += (line.match(/\{/g)||[]).length;
                depth -= (line.match(/\}/g)||[]).length;
                if(depth === 0 && j > i){
                    instrEnd = j;
                    break;
                }
            }
            break;
        }
    }
    if(instrStart === -1 || instrEnd === -1) return s;
    const instrLines = lines.slice(instrStart, instrEnd+1);
    const instrStr = instrLines.join('\n');
    const numbers = [];
    const numMatches = instrStr.match(/\b(\d+)\b/g);
    if(numMatches){
        for(const n of numMatches){
            numbers.push(parseInt(n));
        }
    }
    if(numbers.length === 0) return s;
    let decoded = '';
    for(const n of numbers){
        if(n >= 32 && n <= 126) decoded += String.fromCharCode(n);
        else decoded += '\\' + n;
    }
    const printable = decoded.replace(/[^\x20-\x7E\n\r\t]/g, '').length;
    if(printable/decoded.length < 0.8) return s;
    const before = lines.slice(0, instrStart).join('\n');
    const after = lines.slice(instrEnd+1).join('\n');
    return before + '\n' + '-- VM unpacked: ' + JSON.stringify(decoded) + '\n' + after;
}

function variableStats(s){
    const names=[];
    const re=/\b(?:local\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=/g;
    let m;
    while((m=re.exec(s))!==null){
        if(!names.includes(m[1])) names.push(m[1]);
    }
    const suspicious=names.filter(
        n => /^[IlO0_]{2,}$/.test(n) || /^[a-zA-Z]{1,2}\d+$/.test(n) || n.length>=18
    );
    return { total:names.length, suspicious:suspicious.length };
}

/* =========================================================
   PASADA DEL MOTOR (con fold después de propagate)
========================================================= */
function pass(s){
    let x = s;
    // 1. Escapes
    x = luaStandardEscapes(x);
    x = numericEscapes(x);
    x = hexEscapes(x);
    x = unicodeEscapes(x);
    
    // 2. Decodificadores de strings
    x = decodeStringChar(x);
    x = decodeBase64(x);
    x = decodeBase85(x);
    x = decodeBase91(x);
    x = decodeHexStrings(x);
    x = decodeUrlEncoding(x);
    x = decodeNumericTables(x);
    
    // 3. Plegado inicial
    x = foldStrings(x);
    x = foldMath(x);
    
    // 4. Propagación de constantes
    x = propagateConstants(x);
    
    // 5. Plegado después de propagación (para resolver nuevas concatenaciones)
    x = foldStrings(x);
    x = foldMath(x);
    
    // 6. Desempaquetado de loaders
    x = unpackLoaders(x);
    
    // 7. Limpieza
    x = cleanNoiseComments(x);
    x = unwrapSimpleReturn(x);
    
    // 8. Control Flow y VM
    x = deobfuscateControlFlow(x);
    x = unpackVM(x);
    
    return x;
}

function multiPass(code){
    let current = normalize(code);
    const history = [];
    const max = 30;
    for (let i = 1; i <= max; i++) {
        const before = current;
        const next = pass(current);
        if (next === before) break;
        history.push({ layer:i, before:before.length, after:next.length });
        current = next;
    }
    return { code:current, history };
}

function formatLua(s){
    const lines=s.split("\n");
    const out=[];
    let indent=0;
    for(let raw of lines){
        let line=raw.trim();
        if(!line){ out.push(""); continue; }
        if(/^(end|until)\b/i.test(line) || /^}/.test(line)) indent=Math.max(0,indent-1);
        out.push("    ".repeat(indent)+line);
        const opens = /\b(function|if|for|while|repeat|do)\b/i.test(line);
        const closes = /\bend\s*[,;]?\s*$/i.test(line) || /\buntil\b/i.test(line);
        if(opens && !closes) indent++;
    }
    return out.join("\n");
}

function analyzeCode(code){
    return {
        loadstrings:count(/\bloadstring\s*\(/gi,code),
        httpgets:count(/\bHttpGet\s*\(/gi,code),
        strings:count(/(["'])/g,code)/2,
        chars:count(/string\s*\.\s*char\s*\(/gi,code),
        numeric:count(/\\[0-9]{1,3}/g,code),
        hex:count(/\\x[0-9a-fA-F]{2}/g,code),
        urls:extractUrls(code).length,
        functions:count(/\bfunction\b/gi,code),
        tables:count(/\{/g,code)
    };
}

class ObfuscationDetector {
    constructor(code) { this.code = code; this.indicators = {}; this.type = 'Desconocido'; this.confidence = 0; }
    detect() {
        this.checkBase64(); this.checkBase85(); this.checkBase91();
        this.checkEscapes(); this.checkStringChar(); this.checkXOR();
        this.checkIronBrew(); this.checkLuraph(); this.checkMoonsec(); this.checkBytecode();
        this.checkVM(); this.checkControlFlow(); this.determineType(); return this;
    }
    checkBase64() { const m = this.code.match(/['"]([A-Za-z0-9+/]{30,}={0,2})['"]/g); this.indicators.base64 = m ? m.length : 0; }
    checkBase85() { const m = this.code.match(/<~[\s\S]*?~>/g); this.indicators.base85 = m ? m.length : 0; }
    checkBase91() { const m = this.code.match(/['"]([A-Za-z0-9!#$%&()*+,./:;<=>?@[\]^_`{|}~-]{20,})['"]/g); this.indicators.base91 = m ? m.length : 0; }
    checkEscapes() {
        const hex = (this.code.match(/\\x[0-9a-fA-F]{2}/g)||[]).length;
        const dec = (this.code.match(/\\[0-9]{1,3}/g)||[]).length;
        const uni = (this.code.match(/\\u\{[0-9a-fA-F]+\}/g)||[]).length;
        this.indicators.escapes = hex+dec+uni;
    }
    checkStringChar() { this.indicators.stringChar = (this.code.match(/string\s*\.\s*char\s*\(/gi)||[]).length; }
    checkXOR() {
        let cnt=0;
        [/bit32\s*\.\s*bxor/gi,/bxor\s*\(/gi,/\w+\s*~\s*\d+/g].forEach(p=>cnt+=(this.code.match(p)||[]).length);
        this.indicators.xor = cnt;
    }
    checkIronBrew() {
        const afd=/_aFD\s*=\s*function/.test(this.code), bho=/_bHO\s*=\s*function/.test(this.code);
        const kcx=/local\s+_KCX\s*=\s*\{/.test(this.code), wm=/_WATERMARK\s*=/.test(this.code);
        this.indicators.ironbrew = (afd&&bho&&kcx)?95:(afd||bho)?60:wm?40:0;
    }
    checkLuraph() {
        const dec=/local\s+\w+\s*=\s*function\s*\([a-z]\)/.test(this.code);
        const enc=/\\[0-9]{3}\\/.test(this.code);
        this.indicators.luraph = (dec&&enc)?80:dec?40:0;
    }
    checkMoonsec() { this.indicators.moonsec = (/getfenv\s*\(\s*\)/.test(this.code)&&/setfenv\s*\(/.test(this.code))?75:0; }
    checkBytecode() { const m=this.code.match(/\{\s*\d+(?:\s*,\s*\d+){20,}\s*\}/g); this.indicators.bytecode = m?m.length:0; }
    checkVM() {
        let cnt=0;
        [/while\s+true\s+do[\s\S]*?local\s+\w+\s*=\s*\w+\[/g,
         /if\s+\w+\s*==\s*\d+\s*then[\s\S]*?elseif\s+\w+\s*==\s*\d+/g,
         /local\s+instructions\s*=\s*\{/g].forEach(p=>cnt+=(this.code.match(p)||[]).length);
        this.indicators.vm = cnt;
    }
    checkControlFlow() {
        const sv=/local\s+\w+\s*=\s*0\s*;?\s*\n/.test(this.code);
        const wt=/while\s+true\s+do/.test(this.code);
        const disp=/elseif\s+\w+\s*==\s*\d+\s*then/.test(this.code);
        this.indicators.controlFlow = (wt&&sv&&disp)?85:(wt&&disp)?50:0;
    }
    determineType() {
        const i=this.indicators;
        if(i.ironbrew>=80){this.type='IronBrew 2.0';this.confidence=i.ironbrew}
        else if(i.luraph>=60){this.type='Luraph';this.confidence=i.luraph}
        else if(i.moonsec>=60){this.type='Moonsec';this.confidence=i.moonsec}
        else if(i.vm>=3){this.type='VM Bytecode Personalizada';this.confidence=Math.min(i.vm*20,90)}
        else if(i.controlFlow>=70){this.type='Control Flow Flattening';this.confidence=i.controlFlow}
        else if(i.bytecode>=2){this.type='Array de Bytecode Numérico';this.confidence=80}
        else if(i.xor>=5){this.type='Cifrado XOR';this.confidence=70}
        else if(i.stringChar>=5){this.type='string.char Ofuscado';this.confidence=60}
        else if(i.base64>=3){this.type='Base64 Codificado';this.confidence=70}
        else if(i.base85>=2){this.type='Base85 Codificado';this.confidence=75}
        else if(i.base91>=2){this.type='Base91 Codificado';this.confidence=75}
        else if(i.escapes>=20){this.type='Secuencias de Escape';this.confidence=50}
        else{this.type='Ligeramente Ofuscado / Limpio';this.confidence=30}
    }
    getReport(){ return {type:this.type,confidence:this.confidence,indicators:this.indicators,recommendedDecoders:this.getRecommendedDecoders()}; }
    getRecommendedDecoders(){
        const d=[], i=this.indicators;
        if(i.escapes>0)d.push('Escapes'); if(i.base64>0)d.push('Base64'); if(i.base85>0)d.push('Base85');
        if(i.base91>0)d.push('Base91'); if(i.stringChar>0)d.push('string.char');
        if(i.xor>0)d.push('XOR'); if(i.ironbrew>0)d.push('IronBrew (Base85/91)'); if(i.luraph>0)d.push('Luraph');
        if(i.bytecode>0)d.push('Bytecode→String'); if(i.vm>0)d.push('VM Unpacker'); if(i.controlFlow>0)d.push('Control Flow');
        return d;
    }
}
function detectObfuscation(code){ return new ObfuscationDetector(code).detect().getReport(); }

async function analyze(){
    let code=input.value.trim();
    if(!code){ statusEl.textContent="No hay código"; return; }
    statusEl.textContent="Analizando...";
    try{
        const detection = detectObfuscation(code);
        const statsHtml = `Tipo: ${detection.type}\nConfianza: ${detection.confidence}%\nIndicadores:\n${JSON.stringify(detection.indicators, null, 2)}\nDecodificadores recomendados: ${detection.recommendedDecoders.join(', ') || 'Ninguno'}`;
        tabStats.textContent = statsHtml;

        const url=extractHttpGet(code);
        if(url){
            statusEl.textContent="Obteniendo contenido remoto...";
            try{
                const response=await fetch(url);
                if(response.ok){ code=await response.text(); }
                else{ throw new Error("HTTP "+response.status); }
            }catch(err){
                output.value=`URL DETECTADA\n\n${url}\n\nNo fue posible obtener el contenido.\nMotivo: ${err.message}`;
                analysisInfo.textContent="URL detectada · acceso remoto bloqueado"; statusEl.textContent="Análisis parcial"; return;
            }
        }

        const nestedLoaders = extractNestedLoaders(code);
        const before = analyzeCode(code);
        const result = multiPass(code);
        const formatted = formatLua(result.code);
        const after = analyzeCode(formatted);

        let layersText = `Capas aplicadas: ${result.history.length}\n\n`;
        for(const h of result.history){
            layersText += `Capa ${h.layer}: ${h.before} → ${h.after} (${h.before - h.after > 0 ? '-' : '+'}${Math.abs(h.before - h.after)})\n`;
        }
        tabLayers.textContent = layersText;

        output.value = formatted;
        outputStats.textContent = formatted.length.toLocaleString()+" caracteres";
        const vars = variableStats(formatted);
        analysisInfo.innerHTML = `<span class="ok">🔍 ${detection.type}</span> (${detection.confidence}%) · Capas: ${result.history.length} · Loaders anidados: ${nestedLoaders.length} · string.char: ${before.chars} → ${after.chars} · escapes: ${before.numeric+before.hex} → ${after.numeric+after.hex}`;
        statusEl.textContent = "Listo ✓";
    }catch(err){
        output.value=`ERROR DE ANÁLISIS\n\n${err.message}`;
        analysisInfo.textContent="El análisis encontró un error."; statusEl.textContent="Error";
        console.error(err);
    }
}

async function copyResult(){
    if(!output.value) return;
    try{ await navigator.clipboard.writeText(output.value); statusEl.textContent="Copiado ✓"; }
    catch{ selectResult(); document.execCommand("copy"); statusEl.textContent="Copiado ✓"; }
}
function selectResult(){ output.focus(); output.select(); }
function downloadResult(){
    if(!output.value) return;
    const blob=new Blob([output.value],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download="edsusito_deobfuscated.lua"; a.click(); URL.revokeObjectURL(url);
}
function clearAll(){
    input.value=""; output.value="";
    inputStats.textContent="0 caracteres"; outputStats.textContent="0 caracteres";
    analysisInfo.textContent="Esperando análisis."; statusEl.textContent="Listo";
    tabStats.textContent = ""; tabLayers.textContent = "";
}
